# Verificação e assinatura (GitHub Actions). A cada envio (push) ao GitHub: confere a extensão (testes e
# conferência da Mozilla). Se a versão do manifest.json ainda não tem Release, assina na Mozilla ("não listada":
# grátis, não aparece na loja) e publica o .xpi e o updates.json em Releases (instalação e atualização automática).
# Também roda pelo botão "Run workflow" (aba Actions). A Mozilla não aceita assinar a mesma versão duas vezes:
# se ela já tiver a versão, o .xpi já assinado é baixado de lá (.github/scripts/baixar-assinada.js).
# Precisa de duas chaves da Mozilla guardadas em Settings > Secrets and variables > Actions:
# AMO_JWT_ISSUER e AMO_JWT_SECRET.
name: Assinar extensão

# Envio que só muda textos (README, docs, lista de testes, licença) não roda: não há o que conferir nem assinar.
# Se o envio tiver também algum arquivo da extensão, roda normalmente.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.claude/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.claude/**']
  workflow_dispatch: # permite rodar à mão na aba Actions

permissions:
  contents: write

# Uma execução por vez: a segunda espera a primeira terminar (nunca cancela uma assinatura em andamento).
concurrency:
  group: assinar-extensao
  cancel-in-progress: false

jobs:
  assinar:
    # Versão fixa do Ubuntu: a troca do ubuntu-latest não muda nada sem aviso
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # v0.9.4: espera da aprovação (até 30 min) + download da versão já assinada (até 30 min)
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Testes automáticos
        run: npm test

      - name: Conferência da Mozilla
        run: npm run conferir

      # Pull request só confere; assinar só em envio (push) ou pelo botão.
      - name: Ver se esta versão já foi assinada
        if: github.event_name != 'pull_request'
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO=$(node -p "require('./manifest.json').version")
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSAO" > /dev/null 2>&1; then
            echo "A versão $VERSAO já foi assinada; nada a fazer."
            echo "ja_existe=sim" >> "$GITHUB_OUTPUT"
          fi

      # Se o envio falhar por qualquer motivo (v0.9.4: "fetch failed" = queda de conexão enquanto esperava a
      # aprovação; "Version X already exists" = execução anterior cancelada), não desiste: se a Mozilla já tem a
      # versão, baixa de lá o .xpi assinado (esperando a assinatura, com novas tentativas se a conexão cair);
      # se não tem (saída 2), envia de novo, até 3 vezes.
      - name: Assinar na Mozilla (não listada)
        if: github.event_name != 'pull_request' && steps.versao.outputs.ja_existe != 'sim'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          set +e
          for TENTATIVA in 1 2 3; do
            echo "Envio à Mozilla: tentativa $TENTATIVA de 3."
            npx web-ext sign --channel unlisted --approval-timeout 1800000 \
              --ignore-files "testes/**" "docs/**" "ferramentas-de-teste/**" ".github/**" "scripts/**" \
              package.json package-lock.json CLAUDE.md TESTES-PENDENTES.md
            [ $? -eq 0 ] && exit 0
            echo "O envio falhou; vendo se a Mozilla já recebeu a versão $VERSAO."
            node .github/scripts/baixar-assinada.js "$VERSAO"
            RESULTADO=$?
            [ $RESULTADO -eq 0 ] && exit 0
            [ $RESULTADO -ne 2 ] && exit $RESULTADO
            sleep 60
          done
          exit 1

      - name: Publicar o .xpi em Releases
        if: github.event_name != 'pull_request' && steps.versao.outputs.ja_existe != 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO=${{ steps.versao.outputs.versao }}
          XPI=$(ls -t web-ext-artifacts/*.xpi | head -1)
          cp "$XPI" "extensao-ifto-$VERSAO.xpi"
          # v0.1.2: updates.json diz ao Firefox qual é a versão mais nova (atualização automática;
          # o manifest.json aponta para o updates.json da última Release).
          ID=$(node -p "require('./manifest.json').browser_specific_settings.gecko.id")
          LINK="https://github.com/${{ github.repository }}/releases/download/v$VERSAO/extensao-ifto-$VERSAO.xpi"
          node -e "console.log(JSON.stringify({addons:{[process.argv[1]]:{updates:[{version:process.argv[2],update_link:process.argv[3]}]}}},null,2))" "$ID" "$VERSAO" "$LINK" > updates.json
          # v0.5.0: pacote do Chrome (grátis, sem a loja) na mesma Release.
          npm run empacotar-chrome
          cp "web-ext-artifacts/chrome/extensao-ifto-chrome-$VERSAO.zip" .
          gh release create "v$VERSAO" "extensao-ifto-$VERSAO.xpi" "extensao-ifto-chrome-$VERSAO.zip" updates.json \
            --title "Versão $VERSAO" \
            --notes "Firefox: clique no arquivo .xpi e em Adicionar. Chrome: baixe o .zip, descompacte e carregue a pasta em chrome://extensions (Modo do desenvolvedor > Carregar sem compactação)."
