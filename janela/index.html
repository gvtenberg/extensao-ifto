<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Extensão IFTO Palmas</title>
  <link rel="stylesheet" href="../comum/estilo.css">
  <style>
    body { width: 320px; padding: 16px; }
    .cartao { display: grid; gap: 12px; }
  </style>
</head>
<body>
  <div class="cartao">
    <div>
      <h1>Extensão IFTO Palmas</h1>
      <p class="apoio" id="versao"></p>
    </div>
    <div class="aviso" id="sei"></div>
    <div class="aviso pendencia" id="acesso" hidden>A extensão ainda não tem licença para funcionar no SEI sozinha: o painel some quando a página muda. Clique em "Permitir no SEI" e confirme.</div>
    <button class="botao principal" id="permitir-sei" type="button" hidden>Permitir no SEI</button>
    <button class="botao principal" id="abrir-configuracoes" type="button">Configurações</button>
    <button class="botao" id="procurar-atualizacao" type="button">Procurar atualização</button>
    <div class="aviso" id="atualizacao" hidden></div>
    <button class="botao principal" id="pagina-atualizacao" type="button" hidden>Abrir a página da versão</button>
  </div>
  <script src="../comum/sei.js"></script>
  <script src="../comum/atualizacao.js"></script>
  <script src="index.js"></script>
</body>
</html>
