<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Configurações – Extensão IFTO Palmas</title>
  <link rel="stylesheet" href="../comum/estilo.css">
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
    .titulo-pagina { font-size: 28px; font-weight: 700; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1 class="titulo-pagina">Configurações</h1>
    <section class="cartao">
      <h1>SEI</h1>
      <label class="opcao">
        <input type="checkbox" id="preencherDocumentoExterno">
        <span>
          Preencher documento externo novo
          <span class="apoio" style="display:block">Ao incluir um documento externo, já marca a data de hoje, o formato Nato-digital e o nível de acesso Público. Documentos que já existem no processo não são alterados.</span>
        </span>
      </label>
      <label class="opcao">
        <input type="checkbox" id="senhaReconhecidaPeloNavegador">
        <span>
          Navegador reconhece o campo de senha
          <span class="apoio" style="display:block">Na tela de entrada do SEI e na assinatura de documentos, o SEI novo esconde a senha de um jeito que o navegador não a reconhece. Ligado, o navegador volta a oferecer a senha guardada.</span>
        </span>
      </label>
    </section>
    <section class="cartao">
      <h1>Lista de assinaturas no SEI</h1>
      <p class="apoio">Painel no SEI para colar uma lista de processos e documentos e abrir um por vez, para assinar ou dar ciência.</p>
      <label class="opcao">
        <input type="radio" name="listaAssinaturas" value="automatica">
        <span>
          Automática
          <span class="apoio" style="display:block">Aparece só quando a unidade aberta no SEI é a Direção-geral (PAL/REI/IFTO).</span>
        </span>
      </label>
      <label class="opcao">
        <input type="radio" name="listaAssinaturas" value="sempre">
        <span>Sempre ligada, em qualquer unidade</span>
      </label>
      <label class="opcao">
        <input type="radio" name="listaAssinaturas" value="desligada">
        <span>Desligada</span>
      </label>
    </section>
    <div class="aviso sucesso" id="gravado" hidden>Configuração gravada.</div>
  </main>
  <script src="../comum/configuracoes.js"></script>
  <script src="index.js"></script>
</body>
</html>
