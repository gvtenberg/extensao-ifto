<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Configurações – Extensão IFTO Palmas</title>
  <link rel="stylesheet" href="../comum/estilo.css">
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
    .titulo-pagina { font-size: 28px; font-weight: 700; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1 class="titulo-pagina">Configurações</h1>
    <section class="cartao">
      <h1>SEI</h1>
      <label class="opcao">
        <input type="checkbox" id="novoDocumentoSempreVisivel">
        <span>
          Botão "Novo documento" sempre visível
          <span class="apoio" style="display:block">Mostra o botão de incluir documento na barra de ações do processo, mesmo quando o SEI o esconde.</span>
        </span>
      </label>
    </section>
    <div class="aviso sucesso" id="gravado" hidden>Configuração gravada.</div>
  </main>
  <script src="../comum/configuracoes.js"></script>
  <script src="index.js"></script>
</body>
</html>
